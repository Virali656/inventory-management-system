services:
  # PostgreSQL Database
  - type: pserv
    name: inventory-db
    plan: free
    region: oregon
    env: docker
    dockerfilePath: ./Dockerfile.postgres
    envVars:
      - key: POSTGRES_USER
        generateValue: true
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: inventory_db

  # Backend API
  - type: web
    name: inventory-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
    healthCheckPath: /health

  # Frontend
  - type: web
    name: inventory-frontend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.frontend
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: inventory-backend
          property: host
